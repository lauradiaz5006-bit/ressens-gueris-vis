    #cercle{--encre:#4A2342;--doux:#8E6383;--ligne:#F1DDE2;max-width:46rem;margin:0 auto;padding:.4rem 1rem 2rem;color:var(--encre)}

    .ce-carte p:last-child{margin-bottom:0}
    .ce-plus{display:inline-flex;align-items:center;gap:.3rem;margin-top:.35rem;font-weight:700;font-size:.88rem;color:var(--prune)}
    .ce-plus::after{content:"";width:.45rem;height:.45rem;border-right:2px solid currentColor;border-top:2px solid currentColor;transform:rotate(45deg)}
    .ce-bt{display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin-top:.55rem;padding:.55rem 1.15rem;border-radius:99px;background:var(--prune);color:#fff;font:700 .92rem/1 var(--texte);border:0;text-decoration:none;cursor:pointer}
    .ce-bt.clair{background:#FBF0E4;color:var(--prune)}
    .ce-chargement{padding:3rem 0;text-align:center;color:var(--doux)}
    /* Point du jour */
    .ce-choix{display:flex;gap:.55rem;margin-top:.6rem}
    .ce-choix button{flex:1;min-height:46px;border-radius:99px;border:1.5px solid #EBCFD5;background:#fff;font:700 .95rem/1 var(--texte);color:var(--prune);cursor:pointer}
    .ce-choix button[aria-pressed="true"]{background:var(--prune);border-color:var(--prune);color:#fff}
    .ce-force{margin-top:.8rem}
    .ce-force label{display:block;font-size:.9rem;margin-bottom:.3rem}
    .ce-force input{width:100%;accent-color:var(--prune)}
    .ce-frise{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin:.85rem 0 .45rem}
    .ce-frise i{height:18px;border-radius:5px;background:#F4E8EC}
    .ce-frise .o1{background:#E9C9B0}.ce-frise .o2{background:#D7A27C}.ce-frise .o3{background:#B98A55}.ce-frise .no{background:#E5DAF0}
    .ce-frise .auj{box-shadow:inset 0 0 0 2px var(--prune)}
    .ce-ligne{display:flex;justify-content:space-between;gap:.6rem;font-size:.85rem;color:var(--doux)}
    .ce-discret{font-size:.8rem;color:var(--doux);margin-top:.45rem}
    /* Les deux livres */
    .ce-duo{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin:0 0 .85rem}
    .ce-livre{display:flex;flex-direction:column;justify-content:space-between;gap:.8rem;min-height:9.6rem;padding:1rem;border-radius:20px;color:#fff;text-decoration:none;box-shadow:0 10px 24px rgba(59,23,71,.18)}

    .ce-livre.b{background:linear-gradient(150deg,#C99766,#8A5A22)}

    .ce-livre b{display:block;font:400 1.15rem/1.2 var(--display);margin-top:.35rem}
    .ce-mini{height:5px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden;margin-bottom:.35rem}
    .ce-mini i{display:block;height:100%;background:#fff;border-radius:9px}
    .ce-livre span{font-size:.8rem;opacity:.95}
    /* Mon mois */

    /* Moi */
    .ce-liste{padding:.3rem 1.15rem}
    .ce-r-etat{font-weight:600;color:var(--prune)}
    [data-rappels] .ce-bt{margin-top:.7rem}

    .ce-liste a+a{border-top:1px solid var(--ligne)}
    .ce-liste b{display:block;font:400 1.08rem/1.25 var(--display);color:var(--prune)}
    .ce-liste span{display:block;font-size:.85rem;color:var(--doux);margin-top:.1rem}
    .ce-liste a::after{content:"";width:.45rem;height:.45rem;border-right:2px solid #C9A3B8;border-top:2px solid #C9A3B8;transform:rotate(45deg)}
    .ce-titre-liste{font:700 .72rem/1.3 var(--texte);letter-spacing:.14em;text-transform:uppercase;color:#A2753F;margin:1.3rem .2rem .55rem}
    .ce-formation{display:grid;grid-template-columns:72px 1fr;gap:.9rem;align-items:center;background:linear-gradient(140deg,#3B1747,#6B2F5B);color:#F7E6EE;border:0}
    .ce-formation img{width:72px;height:auto;border-radius:8px;box-shadow:0 8px 18px rgba(0,0,0,.25)}
    .ce-formation h3{color:#fff!important}
    .ce-formation .ce-etiq{color:#F3DCC0}
    /* Porte (non-membre) */
    .ce-porte{text-align:center;padding:1.6rem 1.3rem}
    .ce-porte img{width:84px;height:84px;border-radius:22px;box-shadow:0 10px 26px rgba(59,23,71,.25);margin-bottom:.8rem}
    .ce-porte ul{text-align:left;margin:1rem auto;max-width:26rem;padding-left:1.1rem}
    .ce-porte li{margin:.3rem 0}
    .ce-porte li::marker{color:var(--champagne)}
    .ce-actions{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-top:.8rem}
    /* Le panneau qui monte du bas */
    .ce-voile{position:fixed;inset:0;z-index:150;background:rgba(46,19,56,.45);opacity:0;transition:opacity .25s}
    .ce-voile.ouvert{opacity:1}
    .ce-feuille{position:fixed;left:0;right:0;bottom:0;z-index:151;max-width:46rem;margin:0 auto;max-height:88vh;display:flex;flex-direction:column;background:#FFF9F4;border-radius:26px 26px 0 0;box-shadow:0 -16px 50px rgba(46,19,56,.3);transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);color:var(--encre,#4A2342)}
    .ce-feuille.ouvert{transform:none}
    .ce-poignee{flex:0 0 auto;padding:.7rem 0 .3rem;display:grid;place-items:center;cursor:grab;touch-action:none}
    .ce-poignee::before{content:"";width:44px;height:5px;border-radius:9px;background:#E3CCD5}
    .ce-f-fermer{position:absolute;top:.55rem;right:.7rem;width:44px;height:44px;border-radius:50%;border:0;background:#F6E3E8;color:var(--prune);font-size:1.4rem;line-height:1;cursor:pointer}
    .ce-f-corps{overflow-y:auto;padding:.4rem 1.4rem calc(1.6rem + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
    .ce-f-corps h2{font:400 1.55rem/1.2 var(--display);color:#3B1747;margin:.2rem 2.6rem .7rem 0}
    .ce-f-corps p{margin:0 0 .8rem;line-height:1.6}
    .ce-f-corps ul,.ce-f-corps ol{margin:.2rem 0 1rem;padding-left:1.2rem}
    .ce-f-corps li{margin:.35rem 0;line-height:1.5}
    .ce-f-corps li::marker{color:var(--champagne)}
    .ce-f-garde{margin:1rem 0;padding:.9rem 1rem;border-radius:16px;background:#FCEFF3;border:1px solid #F1D3DC;font-family:var(--display);font-size:1.12rem;line-height:1.4;color:var(--prune)}
    .ce-f-actions{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.6rem}
    @media (prefers-reduced-motion:reduce){.ce-feuille,.ce-voile{transition:none}}
    @media (min-width:700px){#cercle{padding-top:1rem}.ce-dom{grid-template-columns:repeat(4,1fr)}}
    @media (max-width:360px){.ce-duo,.ce-dom{grid-template-columns:1fr}}
  </style>

        ? passes.map(function (x) { var p = x.split('-'); return ligne('mon-carnet.html?mois=' + x, cap(MOIS[+p[1] - 1]) + ' ' + p[0], 'Ton carnet') + ligne('mon-suivi-mois.html?mois=' + x, cap(MOIS[+p[1] - 1]) + ' ' + p[0], 'Ton suivi'); }).join('')
        : '<p style="padding:.8rem 0">Tes livres des mois passés restent ici, avec tes réponses, mois après mois.</p>') + '</div>';
      h += '<a class="ce-carte ce-formation" href="formation.html"><img src="assets/formation/module-1-apercu.jpg" width="72" height="102" alt="" loading="lazy"><div><p class="ce-etiq">La formation · Sors de la boucle</p><h3>Va plus loin que le mois</h3><p>8 modules, 8 séances audio, un tarif réduit pour les membres du Cercle.</p></div></a>';
      h += '<p class="ce-titre-liste">Mes rappels</p><div class="ce-carte" data-rappels></div>';
      h += '<p class="ce-titre-liste">Réglages</p><div class="ce-carte ce-liste">' +
        (installee ? '' : '<a href="#" data-installer-appli><div><b>Installer l’appli Le Cercle</b><span>Une icône sur ton écran d’accueil</span></div></a>') +
        (gestion ? ligne(esc(gestion), 'Gérer mon abonnement', 'Changer, arrêter, factures') : ligne('abonnement.html', 'Mon abonnement', 'Les formules du Cercle')) +
        ligne('login.html', 'Mon espace Genesolia', 'Mon arbre, mes résultats, mes documents') +
        ligne('index.html?appli=site', 'Le site Genesolia', 'Tous les outils et le blog') +
        ligne('confidentialite.html', 'Mes données', 'Tes écrits sont chiffrés, jamais lus par Genesolia') +
        ligne('mentions-legales.html', 'Mentions légales', '') + '</div>';
      afficher(h);
      var bi = vue.querySelector('[data-installer-appli]');
      if (bi) bi.addEventListener('click', function (e) { e.preventDefault(); if (window.GenesoliaInstaller) window.GenesoliaInstaller.ouvrir(); });
      reglageRappels(vue.querySelector('[data-rappels]'));
    }

    /* ───── Les rappels (notifications) ─────
       Un rappel au plus par jour, écrit à l'avance : ton nouveau carnet, chaque semaine, ta météo de fin de mois, les lunes. */
    var N = window.GenesoliaNotifs;
    var RAPPELS = 'Un petit rappel au plus par jour\u00a0: ton nouveau carnet, le début de chaque semaine, ta météo de fin de mois, la nouvelle et la pleine lune.';
    function reglageRappels(z) {
      if (!z) return;
      if (!N) { z.innerHTML = '<p>' + RAPPELS + '</p><p class="ce-discret">Les rappels ne sont pas disponibles sur cet appareil.</p>'; return; }
      N.etat('cercle').then(function (e) {
        var h = '<p>' + RAPPELS + '</p>';
        if (e === 'installer') h += '<p class="ce-discret">Sur iPhone, ajoute d’abord l’appli Le Cercle à ton écran d’accueil, puis ouvre-la depuis son icône pour activer tes rappels.</p><button type="button" class="ce-bt clair" data-r-installer>Installer l’appli</button>';
        else if (e === 'non-supporte') h += '<p class="ce-discret">Ce navigateur ne permet pas les rappels. Essaie avec l’appli installée, ou avec Chrome, Edge, Firefox ou Safari à jour.</p>';
        else if (e === 'bloque') h += '<p class="ce-discret">Les notifications sont bloquées pour Genesolia sur cet appareil. Pour les autoriser, va dans les réglages de ton téléphone ou de ton navigateur, rubrique Notifications.</p>';
        else if (e === 'actif') h += '<p class="ce-r-etat">Tes rappels sont activés sur cet appareil.</p><button type="button" class="ce-bt clair" data-r-couper>Couper mes rappels</button>';
        else h += '<button type="button" class="ce-bt" data-r-activer>Recevoir mes rappels</button>';
        h += '<p class="ce-erreur" data-r-retour role="status"></p>';
        z.innerHTML = h; typo(z);
        brancherRappels(z, function () { reglageRappels(z); });
      });
    }
    function brancherRappels(z, apres) {
      var ret = z.querySelector('[data-r-retour]');
      var a = z.querySelector('[data-r-activer]'), c = z.querySelector('[data-r-couper]'), i = z.querySelector('[data-r-installer]');
      if (i) i.addEventListener('click', function () { if (window.GenesoliaInstaller) window.GenesoliaInstaller.ouvrir(); });
      if (a) a.addEventListener('click', function () {
        a.disabled = true; if (ret) ret.textContent = '';
        N.activer('cercle', sb).then(function (ok) {
          if (ok) { try { localStorage.setItem('genesolia-rappels-vu', '1'); } catch (x) {} if (window.umami) try { window.umami.track('rappels-actives'); } catch (x) {} apres(); }
          else { a.disabled = false; if (ret) ret.textContent = Notification.permission === 'denied' ? 'Les notifications ont été refusées sur cet appareil.' : 'L’activation n’a pas fonctionné. Réessaie dans un instant.'; }
        });
      });
      if (c) c.addEventListener('click', function () { c.disabled = true; N.couper('cercle').then(apres); });
    }
    /* Sur Aujourd'hui : une seule invitation, discrète, tant que la personne n'a ni activé ni dit « plus tard » */
    function inviteRappels() {
      var z = vue.querySelector('[data-rappels-invite]'); if (!z || !N || !E.user) return;
      var vu = null; try { vu = localStorage.getItem('genesolia-rappels-vu'); } catch (x) {}
      if (vu) return;
      N.etat('cercle').then(function (e) {
        if (e !== 'inactif' || !vue.contains(z)) return;
        z.innerHTML = '<section class="ce-carte"><p class="ce-etiq">Tes rappels</p><h3>Veux-tu un petit rappel au bon moment\u00a0?</h3><p>Ton nouveau carnet, le début de chaque semaine, ta météo de fin de mois, les lunes. Un rappel au plus par jour, et tu peux les couper quand tu veux.</p>' +
          '<div class="ce-actions"><button type="button" class="ce-bt" data-r-activer>Recevoir mes rappels</button><button type="button" class="ce-bt clair" data-r-tard>Plus tard</button></div><p class="ce-erreur" data-r-retour role="status"></p></section>';
        typo(z);
        brancherRappels(z, function () { z.innerHTML = '<section class="ce-carte"><p class="ce-r-etat">C’est fait\u00a0: tes rappels sont activés. Tu peux les régler dans l’onglet Moi.</p></section>'; typo(z); });
        z.querySelector('[data-r-tard]').addEventListener('click', function () { try { localStorage.setItem('genesolia-rappels-vu', '1'); } catch (x) {} z.innerHTML = ''; });
      });
    }

    /* ───── Pas encore membre ───── */
    function vuePorte() {
      var C = E.C, u = E.user;
      afficher('<section class="ce-carte ce-porte"><img src="assets/icones/cercle-192.png" alt="" width="84" height="84"><h1 class="ce-h1">' + (u ? 'Ton Cercle t’attend' : 'Le Cercle, ton espace membre') + '</h1>' +
        '<p>' + (u ? 'Cette appli est réservée aux membres du Cercle. Rejoins-le pour l’ouvrir.' : 'Connecte-toi pour ouvrir ton Cercle.') + '</p>' +
        '<ul><li>Deux livres chaque mois : « J’avance » et « Je me libère »</li><li>Ton mois personnel : tes nombres, ton ciel, ton signe maya</li><li>Ton point du jour et ta météo intérieure, mois après mois</li></ul>' +
        '<div class="ce-actions">' + (u ? '<a class="ce-bt" href="abonnement.html">Découvrir le Cercle</a>' : '<a class="ce-bt" href="login.html?retour=cercle.html">Me connecter</a><a class="ce-bt clair" href="abonnement.html">Découvrir le Cercle</a>') + '</div>' +
        (C ? '<p class="ce-discret" style="margin-top:1rem">Le carnet ' + esc(de(String(C.nomMois).split(' ')[0])) + ' est offert : <a href="mon-carnet.html?mois=' + esc(C.mois) + '">l’ouvrir</a>.</p>' : '') + '</section>');
    }

    /* ───── Navigation entre les onglets ───── */
    function router() {
      var h = (location.hash || '').replace('#', '');
      if (h === 'installer') { history.replaceState(null, '', location.pathname + location.search); h = ''; setTimeout(function () { if (window.GenesoliaInstaller) window.GenesoliaInstaller.ouvrir(); }, 300); }
      fermerFeuille();
      if (!E.membre) return vuePorte();
      if (h === 'mois') vueMois(); else if (h === 'moi') vueMoi(); else vueAujourdhui();
      window.scrollTo(0, 0);
    }
    window.addEventListener('hashchange', router);

    function premierMot(t) { var m = String(t || '').trim().split(/\s+/)[0] || ''; return m ? cap(m).slice(0, 30) : ''; }
    function membre(user) {
      if (LIBRE) return Promise.resolve(true);
      return window.GenesoliaAcces && window.GenesoliaAcces.membre ? window.GenesoliaAcces.membre() : Promise.resolve(false);
    }
    /* Les réponses du carnet (pour ton intention du mois) : lues dans ton coffre chiffré, ou sur cet appareil */
    function lireCarnet(user, C) {
      var local = C ? lire('genesolia-carnet-' + C.mois) : null;
      if (!C || !sb || !window.GenesoliaCoffre || !window.GenesoliaCoffre.accord(user)) return Promise.resolve(local);
      return window.GenesoliaCoffre.lire(sb, user, C.mois).then(function (d) { return d || local; }, function () { return local; });
    }

    var d0 = moisDe(new Date());
    chargerLivre('carnets', d0).then(function (C) {
      E.C = C;
      return chargerLivre('suivi', C ? C.mois : d0);
    }).then(function (S) {
      E.S = S;
      if (!sb) return router();
      sb.auth.getSession().then(function (r) {
        var s = r && r.data && r.data.session;
        if (!s) return router();
        E.user = s.user;
        E.prenom = premierMot((s.user.user_metadata && (s.user.user_metadata.full_name || s.user.user_metadata.prenom)) || '') || premierMot((profil() || {}).prenom || '');
        var rep = window.GenesoliaReperes ? window.GenesoliaReperes.lire(sb, s.user) : Promise.resolve(null);
        if (window.GenesoliaNotifs) window.GenesoliaNotifs.rafraichir(sb);
        return Promise.all([membre(s.user), lireCarnet(s.user, E.C), rep]).then(function (x) { E.membre = !!x[0]; E.carnet = x[1]; router(); });
      }).catch(router);
    });
  })();
  </script>

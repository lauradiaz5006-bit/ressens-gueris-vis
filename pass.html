<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/assets/icones/pass.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icones/pass-apple-180.png">
  <link rel="manifest" href="/pass.webmanifest">
  <meta name="theme-color" content="#3B1747">
  <meta name="apple-mobile-web-app-title" content="Mon enquête">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Le Pass · Mon enquête · Genesolia</title>
  <meta name="description" content="Ton espace pour déposer tes ressentis, chercher à qui ils appartiennent, enquêter dans ta lignée et les libérer : ton fil d'or, ton agenda et ton bilan.">
  <link rel="canonical" href="https://genesolia.fr/pass.html">
  <link rel="stylesheet" href="assets/site.css">
  <style>
    /* L'appli « Le Pass · Mon enquête » : Moi (#), Mon fil d'or (#fil), Mon agenda (#agenda), Mon bilan (#bilan).
       Téléphone : la barre en bas. Ordinateur (1000 px et plus) : un espace avec la barre à gauche et deux colonnes. */
    body.pa-app{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
    #pass{--encre:#3B1747;--doux:#7E5C77;--ligne:#EFDCE3;--or:#B98A55;max-width:46rem;margin:0 auto;padding:.4rem 1rem 2rem;color:var(--encre);min-width:0}
    .pa-h1{font:400 clamp(1.7rem,6.4vw,2.2rem)/1.15 var(--display);color:#3B1747;margin:.7rem 0 .15rem}
    .pa-sous{color:var(--doux);font-size:.95rem;margin:0 0 1.1rem}
    .pa-carte{display:block;width:100%;box-sizing:border-box;background:#fff;border-radius:20px;padding:1.05rem 1.15rem;margin:0 0 .85rem;box-shadow:0 6px 18px rgba(107,47,91,.07);border:1px solid var(--ligne);color:var(--encre);text-decoration:none;text-align:left;font:inherit}
    a.pa-carte,button.pa-carte{cursor:pointer}
    .pa-etiq{display:block;font:700 .7rem/1.3 var(--texte);letter-spacing:.14em;text-transform:uppercase;color:#A2753F;margin:0 0 .4rem}
    .pa-carte h2,.pa-carte h3{font:400 1.25rem/1.25 var(--display);color:var(--prune);margin:0 0 .4rem}
    .pa-carte p{margin:0 0 .4rem;font-size:.95rem;line-height:1.55}
    .pa-carte p:last-child{margin-bottom:0}
    .pa-nuit{background:linear-gradient(160deg,#1F0B2A,#4A1E52 60%,#7A3A68);color:#F7E6EE;border:0;position:relative;overflow:hidden}
    .pa-nuit::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 15%,rgba(255,231,180,.35),transparent 40%),radial-gradient(1.5px 1.5px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 60% 70%,#fff,transparent),radial-gradient(1px 1px at 40% 50%,#fff,transparent),radial-gradient(1px 1px at 75% 40%,#fff,transparent);pointer-events:none}
    .pa-nuit>*{position:relative}
    .pa-nuit h2{color:#fff}.pa-nuit .pa-etiq{color:#F3DCC0}
    .pa-chiffres{display:flex;flex-wrap:wrap;gap:.4rem 1.3rem;margin:.2rem 0 .6rem}
    .pa-chiffres span{display:flex;flex-direction:column;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:#E9CFE0}
    .pa-chiffres b{font:400 2.4rem/1 var(--display);color:#FFE6B8;letter-spacing:0;text-transform:none}
    .pa-bt{display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin-top:.55rem;padding:.55rem 1.15rem;border-radius:99px;background:var(--prune);color:#fff;font:700 .92rem/1 var(--texte);border:0;text-decoration:none;cursor:pointer;box-sizing:border-box}
    .pa-bt.clair{background:#FBF0E4;color:var(--prune)}
    .pa-bt.or{background:linear-gradient(135deg,#E2C48E,#B98A55);color:#3B1747}
    .pa-bt.nuit{background:rgba(255,255,255,.12);color:#FFE6B8;border:1px solid rgba(255,230,184,.35)}
    .pa-bt[disabled]{opacity:.5;cursor:default}
    .pa-outils{display:flex;flex-wrap:wrap;gap:.5rem}.pa-outils .pa-bt{margin-top:.4rem}
    .pa-discret{font-size:.82rem;color:var(--doux);margin-top:.45rem}
    .pa-nuit .pa-discret{color:#E9CFE0}
    .pa-chargement{padding:3rem 0;text-align:center;color:var(--doux)}
    .pa-titre-s{font:400 1.15rem/1.3 var(--display);color:#3B1747;margin:1.1rem 0 .55rem}
    .pa-q-jour{font:400 1.15rem/1.45 var(--display)!important;color:#5A2147}
    .pa-plus{display:inline-block;margin-top:.3rem;font-weight:700;font-size:.88rem;color:#9A3A68}
    .pa-stats{display:flex;flex-wrap:wrap;gap:.5rem 1.4rem;margin:.2rem 0 .3rem!important}
    .pa-stats span{display:flex;flex-direction:column;font-size:.8rem;color:var(--doux);max-width:9rem;line-height:1.3}
    .pa-stats b{font:400 1.9rem/1.1 var(--display);color:var(--prune)}
    .pa-depot{background:linear-gradient(150deg,#FFF6EC,#FCEFF3);border-color:#F1D3DC}
    .pa-deux{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.7rem}
    .pa-deux a{display:block;padding:.85rem .9rem;border-radius:16px;background:#FBF4EA;border:1px solid #EBD3BC;text-decoration:none;color:var(--encre)}
    .pa-deux b{display:block;font:400 1.1rem/1.2 var(--display);color:var(--prune);margin-bottom:.25rem}
    .pa-deux span{font-size:.84rem;line-height:1.45;color:var(--doux)}
    /* Formulaires et puces */
    .pa-form label,.pa-lab{display:block;font-weight:600;margin:.85rem 0 .35rem;line-height:1.4;font-size:.95rem}
    .pa-form small,.pa-lab small{font-weight:400;color:var(--doux)}
    .pa-form input:not([type=checkbox]):not([type=range]),.pa-form textarea,.pa-feuille textarea,.pa-feuille select{width:100%;box-sizing:border-box;min-height:46px;padding:.65rem .8rem;border:1.5px solid #EBCFD5;border-radius:14px;font:inherit;background:#fff;color:var(--encre)}
    .pa-feuille textarea,.pa-form textarea{min-height:88px;resize:vertical}
    .pa-form input[type=range]{width:100%;accent-color:#B0507A}
    .pa-erreur{color:#A33A5A;font-size:.88rem;min-height:1em;margin:.4rem 0 0}
    .pa-puces{display:flex;flex-wrap:wrap;gap:.4rem}
    .pa-puces button{min-height:40px;padding:.4rem .85rem;border-radius:99px;border:1.5px solid #EBCFD5;background:#fff;color:var(--prune);font:600 .88rem/1.2 var(--texte);cursor:pointer}
    .pa-puces button[aria-pressed="true"]{background:#6B2F5B;border-color:#6B2F5B;color:#fff}
    .pa-coche{display:flex!important;gap:.55rem;align-items:flex-start;font-weight:600;margin:1rem 0 .4rem}
    .pa-coche input{width:20px;height:20px;margin-top:.1rem;accent-color:#B0507A;flex:none}
    /* Les fils (ressentis) */
    .pa-fil b{display:block;font:400 1.08rem/1.35 var(--display);color:var(--prune);margin:.1rem 0 .45rem}
    .pa-ligne{display:flex;justify-content:space-between;align-items:center;gap:.6rem}
    .pa-em{font-size:.82rem;color:#9A3A68;font-weight:600}
    .pa-points{display:inline-flex;gap:4px;flex:none}
    .pa-points i{width:9px;height:9px;border-radius:50%;background:#F1E3E8}
    .pa-points i.fait{background:linear-gradient(135deg,#E2C48E,#B98A55)}.pa-points i.ici{background:#B0507A}
    .pa-quoi{font-size:1.35rem!important}
    .pa-pas{list-style:none;display:grid;grid-template-columns:repeat(5,1fr);gap:.3rem;margin:.9rem 0 1.1rem;padding:0;position:relative}
    .pa-pas::before{content:"";position:absolute;left:10%;right:10%;top:20px;height:2px;background:#F1E3E8}
    .pa-pas button{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;gap:.3rem;border:0;background:none;font:600 .7rem/1.2 var(--texte);color:var(--doux);cursor:pointer;padding:0;text-align:center}
    .pa-pas button[disabled]{cursor:default;opacity:.55}
    .pa-pas i{font-style:normal;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid #E2C48E;color:#9A6E38;font:400 1rem/1 var(--display)}
    .pa-pas .fait i{background:linear-gradient(135deg,#E2C48E,#B98A55);border-color:#B98A55;color:#fff}
    .pa-pas .ici i{background:#B0507A;border-color:#B0507A;color:#fff}.pa-pas .ici{color:#9A3A68}
    .pa-h3{font:400 1.35rem/1.2 var(--display);color:#3B1747;margin:0 0 .4rem}
    .pa-resume p{margin:.25rem 0;font-size:.93rem}
    .pa-bloc{margin:1rem 0 1.1rem}
    .pa-bloc h4{font:700 .72rem/1.3 var(--texte);letter-spacing:.14em;text-transform:uppercase;color:#A2753F;margin:0 0 .5rem}
    .pa-bloc label{display:block;font-weight:600;margin:.7rem 0 .3rem;line-height:1.4}
    .pa-echos{margin:.2rem 0 0;padding-left:1.1rem}.pa-echos li{margin:.35rem 0;line-height:1.5;font-size:.93rem}.pa-echos li::marker{color:var(--or)}
    .pa-cycles{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:0 0 .7rem}
    .pa-cycles div{padding:.7rem .8rem;border-radius:14px;background:#FBF4EA;border:1px solid #EBD3BC;font-size:.85rem;line-height:1.45}
    .pa-cycles b{display:block;font:400 1rem/1.2 var(--display);color:var(--prune);margin-bottom:.2rem}.pa-cycles span{display:block}
    .pa-coches{list-style:none;padding:0;margin:0}.pa-coches li{padding:.45rem 0;border-bottom:1px solid var(--ligne)}
    .pa-coches label{display:flex!important;gap:.55rem;align-items:flex-start;font-weight:400!important;margin:0!important}
    .pa-coches input{width:20px;height:20px;flex:none;margin-top:.15rem;accent-color:#B0507A}
    .pa-ou{list-style:none;padding:0;margin:0;display:grid;gap:.45rem}
    .pa-ou li{padding:.6rem .75rem;border-radius:12px;background:#FFF9F4;border:1px solid var(--ligne)}
    .pa-ou b{display:block;color:var(--prune);font-size:.93rem}.pa-ou span{font-size:.85rem;color:var(--doux)}
    .pa-actions{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1rem;margin-top:1rem}
    .pa-lien-s{border:0;background:none;color:var(--doux);text-decoration:underline;font:inherit;font-size:.85rem;cursor:pointer;min-height:44px}
    /* Libérer : les 5 étapes de la clé */
    .pa-feuille input:not([type=checkbox]){width:100%;box-sizing:border-box;min-height:46px;padding:.6rem .8rem;border:1.5px solid #EBCFD5;border-radius:14px;font:inherit;background:#fff;color:var(--encre)}
    .pa-lib{margin:1rem 0}
    .pa-lib-e{display:grid;grid-template-columns:2.2rem 1fr;gap:.7rem;padding:.9rem 0;border-top:1px solid var(--ligne)}
    .pa-lib-e>span{width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#E2C48E,#B98A55);color:#fff;font:400 1.05rem/1 var(--display)}
    .pa-lib-e h4{font:400 1.2rem/1.2 var(--display);color:#3B1747;margin:.2rem 0 .35rem}
    .pa-lib-e p{margin:0 0 .4rem;line-height:1.55}.pa-lib-e ol{margin:0;padding-left:1.1rem}.pa-lib-e li{margin:.35rem 0;line-height:1.55}
    .pa-resp{display:flex;align-items:center;gap:1.2rem;margin:.6rem 0 .2rem}
    .pa-resp i{flex:none;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font:600 .74rem/1.2 var(--texte);font-style:normal;color:#5A2147;background:radial-gradient(circle,#FFF4DA,#F2D9A0);box-shadow:0 0 22px rgba(226,196,142,.7);transition:transform 1s ease-in-out;text-align:center}
    .pa-resp .pa-bt{margin:0}
    .pa-phrase{margin:.3rem 0 0;padding:1rem 1.1rem;border-radius:16px;background:linear-gradient(140deg,#2E1338,#6B2F5B);color:#FFF4E6;font:400 1.12rem/1.55 var(--display)}
    .pa-deux-c{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
    @media (max-width:520px){.pa-deux-c{grid-template-columns:1fr}}
    /* La question, la libération en cours, les personnes */
    .pa-grande-q{background:linear-gradient(150deg,#2E1338,#6B2F5B);color:#FFF4E6;border:0}
    .pa-grande-q .pa-etiq,.pa-bloc.pa-grande-q h4{color:#F3DCC0}
    .pa-grande-q p{font:400 1.08rem/1.5 var(--display)!important;margin:0}
    .pa-bloc.pa-grande-q{padding:1rem 1.1rem;border-radius:18px}
    .pa-en-cours{border:1.5px solid #E2C48E;background:linear-gradient(160deg,#FFFCF5,#FFF6EC)}
    .pa-en-cours h2{margin-bottom:.2rem!important}
    .pa-gens{list-style:none;margin:.2rem 0 .3rem;padding:0;display:grid;gap:.4rem}
    .pa-gens button{display:flex;gap:.7rem;align-items:center;width:100%;padding:.5rem .6rem;border-radius:14px;border:1px solid var(--ligne);background:#fff;font:inherit;color:var(--encre);text-align:left;cursor:pointer}
    .pa-gens b{display:block;color:var(--prune)}.pa-gens span{font-size:.84rem;color:var(--doux);line-height:1.35}
    .pa-mini{flex:none;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#E9DCE6);border:1.5px dashed #D9C3CF}
    .pa-mini.paix{border:0;box-shadow:0 0 0 3px #FFF4DA,0 0 14px 4px rgba(242,217,160,.9)}.pa-mini.mitige{border:2.5px solid #E8893A;box-shadow:0 0 10px rgba(232,137,58,.45)}
    .pa-sv-et{font:700 13px var(--texte);fill:#FFE6B8}.pa-et{color:#E2B04A;margin-right:.3rem}
    .pa-commun{padding:.6rem .8rem;border-radius:12px;background:#FFF6E3;border:1px solid #EBD3BC;color:#7A5226;font-size:.9rem;margin:0 0 .8rem}
    .pa-protos{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
    .pa-protos button{padding:.75rem .8rem;border-radius:14px;border:1.5px solid #EBCFD5;background:#fff;text-align:left;font:inherit;cursor:pointer;color:var(--encre)}
    .pa-protos button[aria-pressed="true"]{border-color:#B0507A;background:#FCEFF3;box-shadow:0 0 0 2px rgba(176,80,122,.15)}
    .pa-protos b{display:block;font:400 1.02rem/1.2 var(--display);color:var(--prune);margin-bottom:.2rem}.pa-protos span{font-size:.8rem;color:var(--doux);line-height:1.35}
    /* Le fil d'or dans l'appli */
    .pa-intro{padding:.8rem .9rem;border-radius:14px;background:#FBF4EA;border:1px solid #EBD3BC;margin:0 0 .8rem}.pa-intro p{font-size:.9rem!important}
    .pa-onglets-f{display:flex;gap:.35rem;overflow-x:auto;padding:.1rem 0 .5rem;margin:0 -.2rem .3rem;-webkit-overflow-scrolling:touch}
    .pa-onglets-f button,.pa-onglets-f select{flex:none;min-height:40px;padding:.4rem .8rem;border-radius:99px;border:1.5px solid #EBCFD5;background:#fff;color:var(--prune);font:600 .85rem/1.2 var(--texte);cursor:pointer}
    .pa-onglets-f button[aria-selected="true"]{background:#6B2F5B;border-color:#6B2F5B;color:#fff}
    .pa-onglets-f small{opacity:.75;font-weight:700;margin-left:.15rem}
    .pa-onglets-f select{background:#FBF0E4;border-color:#EBD3BC}
    .pa-pers-f label{display:block;font-weight:600;margin:.3rem 0 .3rem;font-size:.9rem}
    .pa-pers-f input{width:100%;box-sizing:border-box;min-height:44px;padding:.55rem .8rem;border:1.5px solid #EBCFD5;border-radius:12px;font:inherit}
    .pa-moments{list-style:none;padding:0;margin:.7rem 0 0;display:grid;gap:.4rem}
    .pa-moments button{display:grid;grid-template-columns:3rem 1fr;gap:.7rem;align-items:center;width:100%;padding:.55rem .6rem;border-radius:14px;border:1px solid var(--ligne);background:#FFFCFA;text-align:left;font:inherit;color:var(--encre);cursor:pointer}
    .pa-age{display:grid;place-items:center;width:3rem;height:3rem;border-radius:50%;background:linear-gradient(135deg,#FFF1CF,#E2C48E);font:400 1.15rem/1 var(--display);color:#5A3A1A}.pa-age small{font:600 .6rem/1 var(--texte);display:block}
    .pa-moments b{display:block;color:var(--prune);font-weight:600;line-height:1.35}.pa-moments small{display:block;color:#9A3A68;font-size:.8rem;margin-top:.15rem}
    /* Le chemin du mois */
    .pa-frise{list-style:none;padding:0;margin:.3rem 0 .4rem;position:relative}
    .pa-frise::before{content:"";position:absolute;left:1.05rem;top:.6rem;bottom:.6rem;width:2px;background:#F1E3E8}
    .pa-frise li{display:grid;grid-template-columns:2.2rem 1fr;gap:.6rem;align-items:start;position:relative;padding:.3rem 0}
    .pa-frise li>b{width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid #E7A79E;font:400 .95rem/1 var(--display);color:var(--prune);position:relative}
    .pa-frise li.libere>b,.pa-frise li.spirale>b{border-color:#E2B04A;background:#FFF6E3}.pa-frise li.gesteDate>b{border-color:#5FA88A}
    .pa-frise button{border:0;background:none;text-align:left;font:inherit;color:var(--encre);padding:.35rem 0;cursor:pointer}
    .pa-frise button span{display:block;font-weight:600;line-height:1.35}.pa-frise small{display:block;color:var(--doux);font-size:.82rem}
    /* Voir, la ligne du temps, l'intention, réapprendre, les rêves */
    .pa-miroir{padding:.9rem 1rem;border-radius:16px;background:#FFF9F0;border:1px solid #EBD3BC}
    .pa-prise textarea{border-color:#E2C48E;background:#FFFCF5;min-height:96px}
    .pa-portes{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem;margin:0 0 .8rem}
    .pa-portes button,.pa-qui-l button{padding:.7rem .6rem;border-radius:14px;border:1.5px solid #EBCFD5;background:#fff;font:inherit;color:var(--encre);cursor:pointer;text-align:left}
    .pa-portes button[aria-pressed="true"],.pa-qui-l button[aria-pressed="true"]{border-color:#B0507A;background:#FCEFF3;box-shadow:0 0 0 2px rgba(176,80,122,.15)}
    .pa-portes b{display:block;font:400 1rem/1.2 var(--display);color:var(--prune);margin-bottom:.2rem}.pa-portes span{font-size:.78rem;color:var(--doux);line-height:1.3;display:block}
    .pa-frise-vie input[type=range]{width:100%;accent-color:#B0507A;margin:.4rem 0}
    .pa-frise-vie label{display:block;font-weight:600}.pa-frise-vie label b{color:#9A3A68;font-family:var(--display);font-size:1.15rem}
    .pa-qui-l{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.2rem,1fr));gap:.45rem}
    .pa-qui-l button{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.25rem}
    .pa-qui-l b{color:var(--prune)}.pa-qui-l span{font-size:.75rem;color:var(--doux)}
    .pa-plus-loin{margin:1rem 0;border-top:1px solid var(--ligne);padding-top:.7rem}.pa-plus-loin summary{cursor:pointer;font-weight:700;color:#9A3A68;min-height:32px}
    .pa-tenir{position:relative;display:grid;place-items:center;width:150px;height:150px;margin:1rem auto .4rem;border:0;border-radius:50%;background:radial-gradient(circle,#FFFDF6,#F6E7C6);box-shadow:0 0 30px rgba(226,196,142,.5);cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}
    .pa-tenir i{position:absolute;inset:0;border-radius:50%;background:conic-gradient(#E2B04A 0deg,transparent 0deg);-webkit-mask:radial-gradient(circle,transparent 66px,#000 67px);mask:radial-gradient(circle,transparent 66px,#000 67px)}
    .pa-tenir.tient i{animation:pa-rempli 3s linear forwards}
    @property --pa-a{syntax:'<angle>';inherits:false;initial-value:0deg}
    @keyframes pa-rempli{from{--pa-a:0deg}to{--pa-a:360deg}}
    .pa-tenir.tient i{background:conic-gradient(#E2B04A var(--pa-a),transparent var(--pa-a))}
    .pa-tenir.tient{box-shadow:0 0 60px 10px rgba(242,193,78,.65);transition:box-shadow 3s}
    .pa-tenir span{position:relative;font:700 .85rem/1.2 var(--texte);color:#7A5226;padding:0 1.2rem;text-align:center}
    .pa-posee{text-align:center;padding:1rem;border-radius:20px;background:radial-gradient(circle at 50% 0%,#FFF6DD,#FFFCF7 70%);border:1px solid #EBD3BC}
    .pa-graine{width:58px;height:58px;margin:0 auto .5rem;border-radius:50%;background:radial-gradient(circle,#fff,#F2D9A0 60%,rgba(242,217,160,0) 72%);box-shadow:0 0 30px 8px rgba(242,193,78,.45)}
    .pa-graine.petite{width:34px;height:34px;margin:0;flex:none;box-shadow:0 0 16px 4px rgba(242,193,78,.4)}
    .pa-int{display:flex;gap:.8rem;align-items:flex-start;padding:.6rem 0}.pa-int+.pa-int{border-top:1px solid var(--ligne)}
    .pa-int-t{font:400 1.08rem/1.4 var(--display)!important;color:#5A2147}
    .pa-corps-j{display:block;margin-top:.5rem;padding:.55rem .8rem;border-radius:12px;border:1.5px dashed #9DC7B5;background:#F4FBF8;color:#2F6B55;font:600 .85rem/1.3 var(--texte);cursor:pointer;text-align:left;min-height:44px}
    .pa-corps-j[aria-pressed="true"]{border-style:solid;background:#E3F4EC}
    .pa-semaine{display:grid;grid-template-columns:repeat(7,1fr);gap:.3rem;margin-top:.6rem}
    .pa-semaine button{min-height:48px;border-radius:12px;border:1.5px solid #CFE5DA;background:#fff;color:#2F6B55;font:700 .9rem/1.1 var(--texte);cursor:pointer}

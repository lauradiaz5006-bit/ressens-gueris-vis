  <meta name="apple-mobile-web-app-title" content="Le Cercle">
  <meta name="theme-color" content="#6B2F5B">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Mon suivi du mois · Le Cercle · Genesolia</title>
  <meta name="description" content="Ton suivi « Je me libère » du Cercle : la saison, le thème du mois, quatre semaines pour voir, remonter à la source, libérer et remplacer, une méditation et ton bilan.">
  <!-- Numéro de version (assets/version.js, une seule constante à changer) : ajouté en ?v=… aux styles, scripts et contenus -->
  <script>document.write('<script src="assets/version.js?t=' + Date.now() + '"><\/script>');</script>
  <script>(window.genesoliaEcrire || function (l) { l.forEach(function (s) { document.write('<link rel="stylesheet" href="' + s + '">'); }); })(['assets/site.css', 'assets/livre.css']);</script>
</head>
<body class="nouveau">
  <header data-entete></header>
  <main>
    <div id="carnet"><p class="mc-chargement">Ton suivi s’ouvre…</p></div>
  </main>
  <footer data-pied></footer>
  <script>(window.genesoliaEcrire || function (l) { l.forEach(function (s) { document.write('<script src="' + s + '"><\/script>'); }); })(['assets/site.js', 'assets/supabase.js', 'assets/mon-chemin.js', 'assets/saisons.js']);</script>
  <script>
  /* Quel suivi ouvrir ? La règle (?mois=, ?etape=, &apercu, membre par étapes, visiteur) est dans assets/site.js : GenesoliaAcces.ouvrirParEtapes,
     la même que pour Mon carnet (mon-carnet.html). Les réponses restent liées au fichier (même clé qu'avant). */
  (function () {
    function go() { window.GenesoliaAcces.ouvrirParEtapes({ dossier: 'assets/suivi/', erreur: 'Le suivi ne s’ouvre pas pour l’instant. Recharge la page.' }); }
    /* les scripts « defer » (ciel, nombres, maya) sont prêts au DOMContentLoaded */
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
  })();
  </script>
</body>
</html>

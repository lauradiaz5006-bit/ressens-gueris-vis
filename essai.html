<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#6B2F5B">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Ton mois offert dans Le Cercle · Genesolia</title>
  <link rel="stylesheet" href="assets/site.css">
  <style>
    .e-zone{min-height:calc(100vh - 70px);padding:3rem 16px 4rem;background:radial-gradient(40rem 26rem at 85% 0%,rgba(248,214,200,.6),transparent 60%),var(--nacre)}
    .e-boite{max-width:40rem;margin:0 auto}
    .e-etapes{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;list-style:none;margin:0 0 1.6rem;padding:0;counter-reset:e}
    .e-etapes li{counter-increment:e;font-size:.82rem;font-weight:600;color:var(--prune-doux);padding-top:.7rem;border-top:4px solid var(--rose-fonce)}
    .e-etapes li::before{content:counter(e) ". "}
    .e-etapes li.faite{border-color:var(--champagne);color:var(--prune)}
    .e-etapes li.active{border-color:var(--prune);color:var(--prune)}
    .e-carte{background:var(--blanc);border:1px solid var(--rose);border-radius:var(--rayon);padding:2rem;box-shadow:0 24px 60px rgba(107,47,91,.1)}
    .e-carte h1{font-size:clamp(1.7rem,3.4vw,2.2rem);margin-bottom:.5rem}
    .e-carte > p{color:var(--prune-doux)}
    .e-offre{margin:1.2rem 0;padding:1rem 1.2rem;border-radius:16px;background:#FFF6EC;border:1px solid var(--champagne-clair)}
    .e-offre p{margin:0}
    .e-offre .e-gros{font-family:var(--display);font-size:1.5rem;line-height:1.2}
    .e-offre s{color:var(--prune-doux)}
    .e-actions{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;margin-top:1.4rem}
    .e-q{border:0;padding:0;margin:1.4rem 0 0}
    .e-q legend{font-weight:600;margin-bottom:.6rem}
    .e-q label{display:flex;gap:.6rem;align-items:flex-start;padding:.55rem .8rem;border:1.5px solid var(--rose);border-radius:12px;margin-bottom:.45rem;cursor:pointer}
    .e-q label:has(input:checked){border-color:var(--prune);background:var(--nacre)}
    .e-q input{accent-color:var(--prune);margin-top:.3rem;flex-shrink:0}
    .e-q textarea{width:100%;box-sizing:border-box;min-height:5.5rem;font:400 1rem var(--texte);color:var(--prune);padding:.75rem .9rem;border:1.5px solid var(--rose-fonce);border-radius:14px}
    .e-aide{font-size:.85rem;color:var(--prune-doux);margin-top:.35rem}
    .e-choix{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin:1rem 0}
    .e-choix label{display:block;padding:1rem;border:1.5px solid var(--rose);border-radius:14px;cursor:pointer}
    .e-choix label:has(input:checked){border-color:var(--prune);background:var(--nacre)}
    .e-choix input{accent-color:var(--prune)}
    .e-choix b{display:block;font-family:var(--display);font-weight:400;font-size:1.25rem;margin:.2rem 0}
    .e-choix span{font-size:.88rem;color:var(--prune-doux)}
    .e-liste{list-style:none;padding:0;margin:1rem 0;display:grid;gap:.45rem}
    .e-liste li{position:relative;padding-left:1.4rem}
    .e-liste li::before{content:"";position:absolute;left:0;top:.55em;width:.55rem;height:.55rem;border-radius:50%;background:var(--champagne)}
    .e-erreur{color:#A33A4A;font-size:.9rem;min-height:1.2em;margin:.6rem 0 0}
    .e-rassure{font-size:.85rem;color:var(--prune-doux);margin-top:1rem}
    @media (max-width:560px){.e-carte{padding:1.4rem}.e-choix{grid-template-columns:1fr}}
  </style>
</head>
<body class="nouveau">
  <header data-entete></header>
  <main class="e-zone">
    <div class="e-boite">
      <ol class="e-etapes" aria-label="Étapes">
        <li id="et-1">Ton compte</li>
        <li id="et-3">Ton mois offert</li>
      </ol>
      <div class="e-carte" id="e-carte" aria-live="polite"><p>Chargement…</p></div>
    </div>
  </main>
  <footer data-pied></footer>
  <script src="assets/site.js"></script>
  <script src="assets/supabase.js"></script>
  <script>
  (function () {
    'use strict';
    var SB_URL = 'https://qsvzzkjtjsznfntahvvh.supabase.co';
    var SB_KEY = 'sb_publishable_6iEVxXmtB_u1hJ6mPS9fNg_CJhLjYkg';
    var carte = document.getElementById('e-carte');
    var sb = null, user = null;
    try { sb = window.supabase.createClient(SB_URL, SB_KEY); } catch (e) {}
    function etape(n) {
      [1, 3].forEach(function (i) {
        var li = document.getElementById('et-' + i);
        li.className = i < n ? 'faite' : (i === n ? 'active' : '');
        if (i === n) li.setAttribute('aria-current', 'step'); else li.removeAttribute('aria-current');
      });
      window.scrollTo(0, 0);
    }
    function suivi(nom) { if (window.umami) try { window.umami.track(nom); } catch (e) {} }
    var CONTENU = '<ul class="e-liste">' +
      '<li><b>Renaissance</b>, ton carnet pour sortir du mode survie et vivre en accord avec toi</li>' +
      '<li><b>Libération</b>, ton livret pour comprendre comment tu aimes, et aimer plus grand</li>' +
      '<li>Deux séances audio guidées à chaque étape, une pour chaque cycle</li>' +
      '<li>La formation « Sors de la boucle », un module par étape des étapes 1 à 8</li>' +
      '<li>Ton appli Le Cercle, ton mois personnel et ton point du jour</li></ul>';

    /* Étape 1 : créer son compte (sur la page Mon espace, puis retour ici, même depuis un autre appareil) */
    function etape1() {
      etape(1);
      try { localStorage.setItem('retour-apres-connexion', 'essai.html'); } catch (e) {}
      carte.innerHTML =
        '<h1>Ton mois offert commence ici</h1>' +
        '<p>Deux petites étapes, deux minutes en tout. D\'abord ton compte : c\'est là que vivront tes livres, tes réponses et ton parcours.</p>' +
        '<div class="e-offre"><p class="e-gros">Ton 1<sup>er</sup> mois : 0 €</p><p class="e-aide">Aucune carte demandée · ensuite 29 € par mois, sans engagement</p></div>' +
        '<div class="e-actions"><a class="btn btn-plein" href="login.html?inscription&amp;retour=essai.html">Créer mon compte</a><a class="btn btn-trait" href="login.html?retour=essai.html">J\'ai déjà un compte</a></div>';
      suivi('essai-etape-1');
    }

    /* Étape 2 : ouvrir son mois offert en un clic (sans carte tant que le paiement n'est pas ouvert) */
    function etape3() {
      etape(3);
      carte.innerHTML =
        '<h1>Ton mois offert t\'attend' + (prenom() ? ', ' + esc(prenom()) : '') + '</h1>' +
        '<p>Dernière étape : un clic, et ton Cercle s\'ouvre tout de suite, pour 30 jours.</p>' +
        (pdFait() ? '<p class="e-offre" style="margin:1rem 0"><b>Ton point de départ est déjà fait.</b> Il est repris tel quel dans ton Cercle : tu n\'as rien à refaire.</p>' : '') +
        '<p><b>Dès aujourd\'hui, tu as :</b></p>' + CONTENU +
        '<div class="e-actions"><button class="btn btn-plein" type="button" id="e-ouvrir">Ouvrir mon mois offert</button></div>' +
        '<p class="e-rassure">Aucune carte demandée. Tu reçois ton accès par e-mail, et avant la fin de ton mois, on t\'écrit pour te proposer de continuer si tu le souhaites.</p>' +
        '<p class="e-erreur" role="alert"></p>';
      var bt = document.getElementById('e-ouvrir'), err = carte.querySelector('.e-erreur');
      bt.addEventListener('click', function () {
        bt.disabled = true; bt.textContent = 'Ouverture…'; err.textContent = '';
        sb.rpc('cercle_essai').then(function (r) {
          var d = r.data || {};
          if (r.error || !d.statut) throw r.error || new Error('vide');
          if (d.statut === 'ouvert' || d.statut === 'deja') {
            suivi('essai-active');
            try { sb.auth.updateUser({ data: { essai_debut: new Date().toISOString().slice(0, 10) } }); } catch (e) {}
            location.href = 'bienvenue.html';
            return;
          }
          if (d.statut === 'utilise') { dejaUtilise(); return; }
          if (d.statut === 'confirmation') { err.textContent = 'Confirme d\'abord ton adresse avec le lien reçu par e-mail, puis reviens ici.'; }
          else { err.textContent = 'Reconnecte-toi, puis réessaie.'; }
          bt.disabled = false; bt.textContent = 'Ouvrir mon mois offert';
        }).catch(function () {
          err.textContent = 'L\'ouverture n\'a pas fonctionné. Réessaie dans un instant.';
          bt.disabled = false; bt.textContent = 'Ouvrir mon mois offert';
        });
      });
      suivi('essai-etape-3');
    }

    /* Un mois offert déjà utilisé sur ce compte */
    function dejaUtilise() {
      carte.innerHTML =
        '<h1>Ton mois offert est déjà passé</h1>' +
        '<p>Il ne s\'ouvre qu\'une fois par compte. L\'abonnement au Cercle ouvre très bientôt : laisse-nous te prévenir.</p>' +
        '<div class="e-actions"><button class="btn btn-plein" type="button" id="e-prevenir">Me prévenir</button></div><p class="e-erreur" role="alert"></p>';
      var b = document.getElementById('e-prevenir');
      b.addEventListener('click', function () {
        b.disabled = true;
        var data = new FormData();
        data.append('email', user.email || ''); data.append('source', 'essai.html');
        data.append('_subject', 'Le Cercle : à prévenir à l\'ouverture de l\'abonnement');
        window.GenesoliaEnvoyer('Le Cercle : à prévenir', data, 'genesolia-interet')
          .then(function () { b.outerHTML = '<p class="e-gros" style="font-family:var(--display);font-size:1.3rem">C\'est noté, on t\'écrit dès que c\'est ouvert.</p>'; })
          .catch(function () { b.disabled = false; carte.querySelector('.e-erreur').textContent = 'L\'envoi n\'a pas fonctionné. Réessaie dans un instant.'; });
      });
    }

    function pdFait() { try { var x = JSON.parse(localStorage.getItem('genesolia-carnet-point-de-depart') || 'null'); return !!(x && x.v && x.v.fait); } catch (e) { return false; } }
    function esc(t) { return String(t || '').replace(/[<>&"]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]; }); }
    function prenom() { var n = (user && user.user_metadata && user.user_metadata.full_name) || ''; return n.split(' ')[0]; }

    if (!sb) { carte.innerHTML = '<p>La connexion ne répond pas. Vérifie ta connexion internet et recharge la page.</p>'; return; }
    sb.auth.getSession().then(function (r) {
      var s = r.data && r.data.session;
      if (!s) { etape1(); return; }
      user = s.user;
      try { localStorage.removeItem('retour-apres-connexion'); } catch (e) {}
      /* Déjà membre : son Cercle est ouvert, on l'y emmène */
      var m = window.GenesoliaAcces && window.GenesoliaAcces.membre ? window.GenesoliaAcces.membre() : Promise.resolve(false);
      m.then(function (oui) { if (oui) location.replace('cercle.html'); else etape3(); }, etape3);
    }).catch(etape1);
  })();
  </script>
</body>
</html>

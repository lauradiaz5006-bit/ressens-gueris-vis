<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#6B2F5B">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Mon carnet du mois · Le Cercle · Genesolia</title>
  <meta name="description" content="Le carnet du mois du Cercle, à remplir en ligne : ta météo intérieure, ton objectif, les exercices, le rituel et tes quatre semaines.">
  <!-- Numéro de version (assets/version.js, une seule constante à changer) : ajouté en ?v=… aux styles, scripts et contenus -->
  <script>document.write('<script src="assets/version.js?t=' + Date.now() + '"><\/script>');</script>
  <script>(window.genesoliaEcrire || function (l) { l.forEach(function (s) { document.write('<link rel="stylesheet" href="' + s + '">'); }); })(['assets/site.css', 'assets/livre.css']);</script>
</head>
<body class="nouveau">
  <header data-entete></header>
  <main>
    <div id="carnet"><p class="mc-chargement">Ton carnet s’ouvre…</p></div>
  </main>
  <footer data-pied></footer>
  <!-- Scripts avec leur numéro de version (assets/version.js), dans le même ordre qu'avant ; tous prêts avant DOMContentLoaded -->
  <script>(window.genesoliaEcrire || function (l) { l.forEach(function (s) { document.write('<script src="' + s + '"><\/script>'); }); })(['assets/site.js', 'assets/supabase.js', 'assets/mon-chemin.js', 'assets/notifs.js', 'assets/fond-ecran.js',
    'assets/astronomy.browser.min.js', 'assets/astrologie.js', 'assets/numerologie.js', 'assets/maya.js', 'assets/maya-textes.js', 'assets/maya-semaines.js',
    'assets/carnet-accompagnement.js', 'assets/guide-textes.js', 'assets/guide-mois.js', 'assets/lieu-naissance.js', 'assets/saisons.js']);</script>
  <script>
  /* Quel carnet ouvrir ? Même règle que Mon suivi (assets/site.js : GenesoliaAcces.ouvrirParEtapes) :
     ?mois=AAAA-MM (et &apercu) : le carnet de ce mois ; membre du Cercle : son étape (étape 1 = 2026-10 … étape 12 = 2027-09), ?etape=N ;
     visiteur : comme avant, le plus récent déjà paru. Les réponses restent liées au fichier (même clé qu'avant). */
  (function () {
    function go() { window.GenesoliaAcces.ouvrirParEtapes({ dossier: 'assets/carnets/', erreur: 'Le carnet ne s’ouvre pas pour l’instant. Recharge la page.' }); }
    /* les scripts « defer » (ciel, nombres, maya) sont prêts au DOMContentLoaded */
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
  })();
  </script>
</body>
</html>

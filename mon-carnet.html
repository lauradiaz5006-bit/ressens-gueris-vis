<html lang="fr">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#6B2F5B">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Mon carnet du mois · Le Cercle · Genesolia</title>
  <meta name="description" content="Le carnet du mois du Cercle, à remplir en ligne : ta météo intérieure, ton objectif, les exercices, le rituel et tes quatre semaines.">
  <!-- Numéro de version (assets/version.js, une seule constante à changer) : ajouté en ?v=… aux styles, scripts et contenus -->
  <script>document.write('<script src="assets/version.js?t=' + Date.now() + '"><\/script>');</script>
  <script>(window.genesoliaEcrire || function (l) { l.forEach(function (s) { document.write('<link rel="stylesheet" href="' + s + '">'); }); })(['assets/site.css', 'assets/livre.css']);</script>
</head>
<body class="nouveau">
  <header data-entete></header>
  <main>
    <div id="carnet"><p class="mc-chargement">Ton carnet s’ouvre…</p></div>
  </main>
  <footer data-pied></footer>
  <!-- Scripts avec leur numéro de version (assets/version.js), dans le même ordre qu'avant ; tous prêts avant DOMContentLoaded -->
  <script>(window.genesoliaEcrire || function (l) { l.forEach(function (s) { document.write('<script src="' + s + '"><\/script>'); }); })(['assets/site.js', 'assets/supabase.js', 'assets/mon-chemin.js', 'assets/notifs.js', 'assets/fond-ecran.js',
    'assets/astronomy.browser.min.js', 'assets/astrologie.js', 'assets/numerologie.js', 'assets/maya.js', 'assets/maya-textes.js', 'assets/maya-semaines.js',
    'assets/carnet-accompagnement.js', 'assets/guide-textes.js', 'assets/guide-mois.js', 'assets/lieu-naissance.js']);</script>
  <script>
  /* Carnet demandé (?mois=AAAA-MM), sinon le plus récent déjà paru */
  (function () {
    var DISPONIBLES = ['2026-10', '2026-11', '2026-12', '2027-01', '2027-02', '2027-03', '2027-04', '2027-05', '2027-06', '2027-07', '2027-08', '2027-09', '2027-10'];
    var d = new Date(), actuel = d.getFullYear() + '-' + (d.getMonth() < 9 ? '0' : '') + (d.getMonth() + 1);
    var m = new URLSearchParams(location.search).get('mois');
    var apercu = /[?&]apercu\b/.test(location.search);   /* ?apercu : lire les mois à venir (relecture) */
    if (DISPONIBLES.indexOf(m) < 0 || (m > actuel && !apercu)) m = DISPONIBLES.filter(function (x) { return x <= actuel; }).pop() || DISPONIBLES[0];
    function charger(src, ok) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = function () { document.getElementById('carnet').innerHTML = '<p class="mc-chargement">Le carnet ne s’ouvre pas pour l’instant. Recharge la page.</p>'; }; document.body.appendChild(s); }
    function V(s) { return window.genesoliaVersion ? window.genesoliaVersion(s) : s; }   /* ?v=… (assets/version.js) */
    function go() { charger(V('assets/carnets/' + m + '.js'), function () { var plus = document.createElement('script'); plus.src = V('assets/plus/' + m + '.js'); plus.onload = plus.onerror = function () { charger(V('assets/mon-carnet.js'), function () {}); }; document.body.appendChild(plus); }); }
    /* les scripts « defer » (ciel, nombres, maya) sont prêts au DOMContentLoaded */
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
  })();
  </script>
</body>
</html>
